<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 144 144" width="144" height="144" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <polygon id="k" points="11.11,36.23 41.24,36.23 41.24,67.51 88.62,36.23 128.18,36.23 78.04,69.59 132.89,106.15 131.40,107.76 92.76,107.76 41.24,73.72 41.24,107.76 11.11,107.76"/>
    <clipPath id="inside"><use xlink:href="#k" href="#k"/></clipPath>

    <!-- glass body: blue, more see-through toward the bottom-right -->
    <linearGradient id="body" x1="0" y1="0" x2="1.154" y2="0.769">
      <stop offset="0" stop-color="rgb(60,176,218)" stop-opacity="0.88"/>
      <stop offset="1" stop-color="rgb(22,94,140)" stop-opacity="0.72"/>
    </linearGradient>
    <!-- light sheen from the top-left, and a glossy upper half -->
    <radialGradient id="sheen" cx="0.1" cy="-0.1" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.106"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- bright inner edge, strongest along the top -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="0.77">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- thin border, brighter at the top-left -->
    <linearGradient id="edge" x1="0" y1="0" x2="1.154" y2="0.769">
      <stop offset="0" stop-color="rgb(160,230,246)" stop-opacity="0.95"/>
      <stop offset="1" stop-color="rgb(70,172,208)" stop-opacity="0.95"/>
    </linearGradient>
    <!-- soft cyan glow around the letter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="rgb(71,217,255)" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
  </defs>

  <use href="#k" xlink:href="#k" fill="#000" filter="url(#glow)"/>
  <use href="#k" xlink:href="#k" fill="url(#body)"/>
  <use href="#k" xlink:href="#k" fill="url(#sheen)"/>
  <use href="#k" xlink:href="#k" fill="url(#gloss)"/>
  <g clip-path="url(#inside)">
    <use href="#k" xlink:href="#k" fill="none" stroke="url(#rim)" stroke-width="7.2"/>
    <use href="#k" xlink:href="#k" fill="none" stroke="url(#edge)" stroke-width="2.4"/>
  </g>
</svg>
